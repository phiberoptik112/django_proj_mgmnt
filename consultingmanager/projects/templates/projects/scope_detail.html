{% extends 'base/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Scope Item Detail</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>Category:</strong> {{ item.category }}</p>
            <p><strong>Description:</strong> {{ item.description }}</p>
            <p><strong>Source File:</strong> {{ item.source_file }}</p>
            <p><strong>Milestone:</strong> {{ item.milestone }}</p>
            <p><strong>Phase:</strong> {{ item.phase }}</p>
            <p><strong>Created:</strong> {{ item.created_at }}</p>
        </div>
    </div>
    <a href="{% url 'projects:project-detail' item.project.pk %}" class="btn btn-secondary mt-3">Back to Project</a>
</div>
{% endblock %}
