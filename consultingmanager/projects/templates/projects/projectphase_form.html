{% extends 'base/base.html' %}
{% block title %}Project Phase{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Project Phase</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ form.instance.project.get_absolute_url|default:'/' }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
